<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="ReadUp">
  <!--
    Bộ ghép ngang: dấu hiệu + chữ. Dùng cho đầu trang, hồ sơ, slide.

    Chữ đặt bằng font hệ thống chứ không vẽ đường: file này còn phải sửa, và một
    wordmark đã chuyển thành path thì lần sau muốn đổi một chữ là phải vẽ lại từ
    đầu. Khi nào chốt hẳn nhận diện thì mới nên chuyển.
  -->
  <defs>
    <linearGradient id="rz2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="24" fill="url(#rz2)"/>
  <rect x="24" y="28" width="48" height="7" rx="3.5" fill="#FFFFFF" opacity="0.45"/>
  <rect x="24" y="44.5" width="48" height="7" rx="3.5" fill="#FFFFFF"/>
  <rect x="24" y="54" width="48" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.8"/>
  <rect x="24" y="61" width="34" height="7" rx="3.5" fill="#FFFFFF" opacity="0.45"/>

  <text x="116" y="52" font-family="Plus Jakarta Sans, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="34" font-weight="800" fill="#0F172A">ReadUp</text>
  <text x="118" y="72" font-family="Plus Jakarta Sans, Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="12.5" font-weight="600" fill="#64748B" letter-spacing="0.4">EVIDENCE, NOT PERCENTAGES</text>
</svg>
