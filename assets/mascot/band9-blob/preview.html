<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Mascot giọt vàng Band 9</title>
<style>
body{margin:0;background:#0B1026;color:#FFE9A8;font-family:system-ui,sans-serif;padding:24px}
h1{font-size:18px;font-weight:600;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
figure{margin:0;background:#101a3a;border-radius:18px;padding:12px;text-align:center}
img{display:block;margin:0 auto;max-width:100%;height:auto}
figcaption{margin-top:6px;font-size:13px;opacity:.8}
</style></head><body>
<h1>Mascot giọt vàng Band 9 — 8 tư thế</h1>
<div class="grid">
  <figure><img src="idle.svg" width="240" height="240" alt="idle"><figcaption>idle</figcaption></figure>
  <figure><img src="wink-heart.svg" width="240" height="240" alt="wink-heart"><figcaption>wink-heart</figcaption></figure>
  <figure><img src="angry.svg" width="240" height="240" alt="angry"><figcaption>angry</figcaption></figure>
  <figure><img src="sleep.svg" width="240" height="240" alt="sleep"><figcaption>sleep</figcaption></figure>
  <figure><img src="question.svg" width="240" height="240" alt="question"><figcaption>question</figcaption></figure>
  <figure><img src="cheer.svg" width="240" height="240" alt="cheer"><figcaption>cheer</figcaption></figure>
  <figure><img src="loading.svg" width="240" height="240" alt="loading"><figcaption>loading</figcaption></figure>
  <figure><img src="error.svg" width="240" height="240" alt="error"><figcaption>error</figcaption></figure>
</div>
</body></html>
