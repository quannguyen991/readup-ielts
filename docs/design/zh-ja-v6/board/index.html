<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bảng concept Trung · Nhật</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Antique&family=Kaisei+Decol:wght@500;700&family=Yuji+Syuku&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;900&family=ZCOOL+XiaoWei&family=Liu+Jian+Mao+Cao&family=ZCOOL+QingKe+HuangYou&family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0b12; color: #f3efe6; font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
  header.top { padding: 28px 24px 8px; max-width: 1240px; margin: 0 auto; }
  header.top h1 { margin: 0 0 6px; font-size: 26px; }
  header.top p { margin: 0; color: #b9b4a6; font-size: 15px; }
  nav.jump { position: sticky; top: 0; z-index: 20; display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 24px; background: rgba(11,11,18,.88); backdrop-filter: blur(10px); border-bottom: 1px solid #25253a; }
  nav.jump a { color: #f3efe6; text-decoration: none; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 999px; border: 1px solid #3a3a55; }
  nav.jump a:hover { background: #25253a; }
  section.c { max-width: 1240px; margin: 36px auto; padding: 0 24px; }
  .tag { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #9ea0c8; margin-bottom: 6px; }
  h2.name { margin: 0 0 14px; font-size: 22px; }
  h2.name small { font-weight: 400; color: #b9b4a6; font-size: 14px; margin-left: 8px; }
  .hero { position: relative; border-radius: 22px; overflow: hidden; aspect-ratio: 16/7; min-height: 280px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero .wash { position: absolute; inset: 0; }
  .hero .txt { position: absolute; left: 4%; top: 50%; transform: translateY(-50%); max-width: 52%; }
  .hero .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; opacity: .9; margin-bottom: 8px; }
  .hero .big { font-size: clamp(34px, 6vw, 76px); line-height: 1.05; margin: 0; }
  .hero .sub { margin-top: 10px; font-size: clamp(13px, 1.5vw, 17px); max-width: 460px; opacity: .95; }
  .chips { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .chip { padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; backdrop-filter: blur(6px); }
  .row { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 900px) { .row { grid-template-columns: 1fr; } .hero .txt { max-width: 80%; } }
  .panel { border-radius: 18px; padding: 18px; border: 1px solid; }
  .panel h3 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .sw { display: flex; gap: 8px; flex-wrap: wrap; }
  .sw div { width: 62px; text-align: center; font-size: 10px; opacity: .85; }
  .sw i { display: block; height: 42px; border-radius: 10px; margin-bottom: 4px; border: 1px solid rgba(255,255,255,.18); }
  .fonts { margin-top: 14px; display: grid; gap: 4px; }
  .fonts .f1 { font-size: 26px; }
  .fonts .f2 { font-size: 15px; opacity: .85; }
  .why { margin-top: 12px; font-size: 14px; line-height: 1.55; opacity: .9; }
  /* roadmap mock */
  .road { position: relative; border-radius: 18px; overflow: hidden; min-height: 330px; border: 1px solid; }
  .road img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .38; }
  .road .layer { position: absolute; inset: 0; }
  .road h3 { position: relative; margin: 0; padding: 16px 18px 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; opacity: .85; }
  .path { position: relative; padding: 10px 14px 18px; display: grid; gap: 10px; }
  .stone { display: grid; grid-template-columns: 54px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border-radius: 14px; border: 1px solid; backdrop-filter: blur(8px); }
  .stone:nth-child(even) { margin-left: 28px; }
  .stone .seal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 24px; line-height: 1; border: 2px solid; }
  .stone b { display: block; font-size: 15px; }
  .stone span.d { font-size: 12px; opacity: .8; }
  .stone .pct { font-size: 12px; font-weight: 700; }
  .stone.locked { opacity: .6; }
  .bar { height: 5px; border-radius: 99px; margin-top: 6px; background: rgba(255,255,255,.18); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; }
  footer { max-width: 1240px; margin: 40px auto 80px; padding: 0 24px; color: #9a9688; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <h1>Bảng concept giao diện Tiếng Nhật · Tiếng Trung</h1>
  <p>6 hướng, mỗi hướng là tranh nền chính + bảng màu + phông + mẫu lộ trình. Ảnh do Codex tạo, chưa chỉnh sửa.</p>
</header>
<nav class="jump" id="jump"></nav>
<div id="root"></div>
<footer>Chọn 1 hướng cho mỗi tiếng (hoặc trộn: ví dụ Nhật = A, Trung = D). Bước sau: sinh bộ tranh đầy đủ cho hướng đã chọn rồi dựng giao diện thật.</footer>

    levels: [['五', 'N5 · Khởi hành', 'Hiragana, chào hỏi, số đếm', 72], ['四', 'N4 · Sống ở Nhật', 'Mua sắm, đi lại, nhờ vả', 35], ['三', 'N3 · Giao tiếp tự nhiên', 'Kính ngữ, công việc, tin tức', 0], ['二', 'N2 · Làm việc', 'Văn bản, báo chí', 0], ['一', 'N1 · Bậc thầy', 'Đọc sâu, sắc thái', 0]] },

const root = document.getElementById('root');
const jump = document.getElementById('jump');
C.forEach((c) => {
  jump.insertAdjacentHTML('beforeend', `<a href="#${c.id}">${c.name}</a>`);
  const sw = c.pal.map(([n, h]) => `<div><i style="background:${h}"></i>${n}<br>${h}</div>`).join('');
  const stones = c.levels.map(([k, t, d, p], i) => `
    <div class="stone ${p === 0 && i > 1 ? 'locked' : ''}" style="background:${c.panel};border-color:${c.border}">
      <div class="seal" style="border-color:${c.accent};color:${c.accent};font-family:${c.font1}">${k}</div>

    <span class="tag">Tiếng ${c.lang}</span>
    <h2 class="name">${c.name}<small>${c.han}</small></h2>

      </div>
    </div>

      <div class="road" style="background:${c.bg};color:${c.ink};border-color:${c.border}">
        <img class="bg" src="${c.img}" alt="">

      </div>
      <div class="panel" style="background:${c.bg};color:${c.ink};border-color:${c.border}">
        <h3>Bảng màu</h3>
        <div class="sw">${sw}</div>

      </div>
    </div>
  </section>`);

</body>
